[project]
name = "portinari"
version = "0.1.0"
description = "Análise computacional e científica do acervo de Cândido Portinari"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "plotly>=5.15.0",
    "wordcloud>=1.9.0",
    "openpyxl>=3.1.0",
    "jupyter>=1.0.0",
    "pre-commit>=4.6.2",
    "nbstripout>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portinari"]
